<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; color: #e2e8f0; font-family: Inter, system-ui, sans-serif;
    background: #0b1220 radial-gradient(rgba(56, 189, 248, 0.14) 1px, transparent 1px) 0 0 / 22px 22px;
  }
  svg { position: absolute; left: 10px; top: 40px; }
  .text { position: absolute; left: 820px; top: 150px; width: 350px; }
  h1 {
    margin: 0; font: 700 64px/1.05 "JetBrains Mono", monospace; letter-spacing: -0.03em;
  }
  h1::before {
    content: ""; display: block; width: 26px; height: 26px; border-radius: 50%;
    background: #fb923c; margin-bottom: 20px;
  }
  p { margin: 24px 0 0; font-size: 26px; line-height: 1.35; }
  .meta { position: absolute; left: 820px; bottom: 40px; font: 500 20px "JetBrains Mono", monospace; color: #94a3b8; }
  .meta b { color: #38bdf8; font-weight: 500; }
  .legend { position: absolute; left: 40px; bottom: 28px; font: 500 16px "JetBrains Mono", monospace; color: #94a3b8; }
  .ramp { display: inline-block; width: 140px; height: 10px; border-radius: 5px; vertical-align: middle; margin: 0 10px; background: linear-gradient(90deg, #12304f, #1d6fa5, #38bdf8, #bae6fd); }
</style>
<svg id="map" width="800" height="500"></svg>
<div class="legend">__MEASURE__, __YEAR__<br><span style="line-height:2.2">low<span class="ramp"></span>high</span></div>
<div class="text">
  <h1>Cancer Basemap</h1>
  <p>Public cancer data by county and tract, versioned by release</p>
</div>
<div class="meta"><b>basemap.cancerdatasci.org</b><br>release __RELEASE__</div>
<script type="module">
  import { geoPath, geoAlbersUsa } from "https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/+esm";
  import { feature, mesh } from "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm";
  const rows = __ROWS__;  // [fips, value, lo, hi, status]
  const us = await fetch("https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/counties-10m.json").then(r => r.json());
  const byFips = new Map(rows.filter(r => r[4] === "R").map(r => [r[0], r[1]]));
  // Clip the ramp to the 2nd-98th percentile so outliers don't wash it out.
  const v = [...byFips.values()].sort((a, b) => a - b);
  const lo = v[Math.floor(v.length * 0.02)], hi = v[Math.floor(v.length * 0.98)];
  const stops = [[0x12, 0x30, 0x4f], [0x1d, 0x6f, 0xa5], [0x38, 0xbd, 0xf8], [0xba, 0xe6, 0xfd]];
  const ramp = t => {
    t = Math.max(0, Math.min(1, t)) * 3;
    const i = Math.min(2, Math.floor(t)), f = t - i;
    return "rgb(" + stops[i].map((c, k) => Math.round(c + (stops[i + 1][k] - c) * f)).join(",") + ")";
  };
  const proj = geoAlbersUsa().scale(1000).translate([400, 250]);
  const path = geoPath(proj);
  const svg = document.getElementById("map");
  const counties = feature(us, us.objects.counties).features;
  const g = (tag, attrs) => {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    svg.appendChild(el);
  };
  for (const c of counties) {
    const val = byFips.get(c.id);
    // Suppressed or missing counties are drawn as empty panel, never on the ramp.
    g("path", { d: path(c), fill: val === undefined ? "#1a2438" : ramp((val - lo) / (hi - lo)) });
  }
  g("path", { d: path(mesh(us, us.objects.states, (a, b) => a !== b)), fill: "none", stroke: "#0b1220", "stroke-width": 0.9, opacity: 0.55 });
  await document.fonts.ready;
  document.body.dataset.ready = "1";
</script>

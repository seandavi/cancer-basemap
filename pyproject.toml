[project]
name = "cancerbasemap"
version = "0.1.0"
description = "Population cancer data as Iceberg tables"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
    "sqlglot>=30.18.0",
    "xlrd>=2.0.2",
    # publish.py serves http(s) reads from the bundle dir while building cancerbasemap.duckdb;
    # already installed by pyiceberg, declared because we import it.
    "fsspec",
    # hf.py (ADR-0001 § Hugging Face): every gated release is one create_commit + tag, uploaded
    # through Xet (hf-xet comes with it), as biocOnIce and omicidx do. Same pin.
    "huggingface-hub>=2.2.0",
]

[project.scripts]
cancerbasemap = "cancerbasemap.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["slow: hits the live icegate endpoint over the network; deselected by default, run with -m slow"]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cancerbasemap"]
